# docker compose up -d   →  http://localhost:8090
# Light node configured from the seed node. To choose yourself, set for example:
#   TAPSEAL_INIT_ARGS: "--network testnet3 --start 4400000 --peer https://tapseal.xyz"
# Full node on your own Bitcoin RPC:
#   TAPSEAL_INIT_ARGS: "--full --network mainnet --start 900000 --rpc-url https://YOUR-PRIVATE-RPC-HOST --rpc-user u --rpc-password p"
services:
  tapseal-node:
    build: .
    image: tapseal-node:1.2.0-networks.1
    restart: unless-stopped
    ports: ["127.0.0.1:8090:8090"]
    volumes: ["tapseal:/data"]
    environment:
      TAPSEAL_INIT_ARGS: ""
    mem_limit: 384m
volumes:
  tapseal: {}
