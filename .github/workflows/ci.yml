name: source-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-source.py
      - run: npm ci
        working-directory: backend/api
      - run: npm audit --omit=dev --audit-level=high
        working-directory: backend/api
      - run: npm test
        working-directory: backend/api
      - run: python3 -m unittest discover -s backend/protocol -p 'test_*.py'
      - run: python3 -m unittest discover -s backend/indexer -p 'test_*.py'
        env:
          PYTHONPATH: backend/protocol:backend/indexer
      - run: python3 -m unittest discover -s softnode -p test_security.py
      - run: python3 softnode/build-release.py
      - run: cp artifacts/tapseal-node-1.1.5-security.1.tar.gz /tmp/first-build.tar.gz
      - run: python3 softnode/build-release.py
      - run: cmp /tmp/first-build.tar.gz artifacts/tapseal-node-1.1.5-security.1.tar.gz
