name: source-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: node/local-api/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-source.py
      - run: npm ci
        working-directory: node/local-api
      - run: npm audit --omit=dev --audit-level=high
        working-directory: node/local-api
      - run: npm test
        working-directory: node/local-api
      - run: python3 -m unittest discover -s node/protocol -p 'test_*.py'
      - run: python3 -m unittest discover -s node/indexer -p 'test_*.py'
        env:
          PYTHONPATH: node/protocol:node/indexer
      - run: python3 -m unittest discover -s softnode -p test_*.py
      - run: python3 softnode/build-release.py
      - run: cp artifacts/tapseal-node-1.4.1-node-only.1.tar.gz /tmp/first-build.tar.gz
      - run: python3 softnode/build-release.py
      - run: cmp /tmp/first-build.tar.gz artifacts/tapseal-node-1.4.1-node-only.1.tar.gz
